# Publishes the game page (food-guess-game/frontend) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# The page talks to the game server on Render (see render.yaml and
# food-guess-game/frontend/api.js).
name: Deploy the game page

on:
  push:
    branches: [main]
    paths:
      - "food-guess-game/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: food-guess-game/frontend
      - id: deployment
        uses: actions/deploy-pages@v4
